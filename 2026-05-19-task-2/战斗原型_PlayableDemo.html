<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星灵物语 · 战斗原型 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#1a1a2e;min-height:100vh;display:flex;justify-content:center;
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  padding:10px;touch-action:none;user-select:none;
}
.game-container{
  width:100%;max-width:420px;background:linear-gradient(180deg,#FFF8F0,#F0E6D8);
  border-radius:28px;padding:16px;box-shadow:0 8px 40px rgba(0,0,0,0.3);
  position:relative;overflow:hidden;
}
/* Header */
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px;}
.player-info{display:flex;align-items:center;gap:8px;}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7EC8E3,#FFB7C5);display:flex;align-items:center;justify-content:center;font-size:18px;}
.player-name{font-size:13px;font-weight:600;color:#4A4A4A;}
.player-level{font-size:11px;color:#9B9B9B;}
.currency{display:flex;gap:12px;font-size:12px;color:#4A4A4A;}
.currency span{display:flex;align-items:center;gap:3px;}

/* Enemy area */
.enemy-area{background:#FFFFFF;border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,0.06);}
.enemy-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.enemy-info{display:flex;align-items:center;gap:10px;}
.enemy-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.enemy-name{font-size:14px;font-weight:600;color:#4A4A4A;}
.hp-bar-wrap{flex:1;margin:0 12px;}
.hp-bar-bg{height:10px;background:#FCEBEB;border-radius:5px;overflow:hidden;}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,#E24B4A,#FF6B6B);border-radius:5px;transition:width 0.4s ease;}
.hp-text{font-size:12px;color:#9B9B9B;white-space:nowrap;}
.steps-box{background:#FAEEDA;border-radius:10px;padding:6px 14px;text-align:center;border:1px solid #FAC775;}
.steps-label{font-size:9px;color:#854F0B;}
.steps-num{font-size:20px;font-weight:700;color:#854F0B;line-height:1.2;}
.enemy-portrait{text-align:center;padding:12px 0 4px;position:relative;min-height:90px;}
.enemy-sprite{font-size:60px;transition:all 0.15s;display:inline-block;}
.enemy-sprite.hit{animation:hitShake 0.3s;}
@keyframes hitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dmg-float{position:absolute;font-size:28px;font-weight:800;color:#FF4444;pointer-events:none;animation:floatUp 0.9s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}

/* Board */
.board-wrap{background:#F9F6F0;border-radius:16px;padding:8px;margin-bottom:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,0.06);}
.status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 4px;}
.score{font-size:13px;font-weight:600;color:#4A4A4A;}
.combo{font-size:13px;font-weight:700;color:#FF6B9D;min-height:20px;transition:all 0.2s;}
.combo.active{animation:comboPop 0.3s;}
@keyframes comboPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;aspect-ratio:1;}
.gem{
  border-radius:6px;cursor:pointer;transition:all 0.12s ease;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;aspect-ratio:1;min-height:0;
  border:2px solid transparent;position:relative;
}
.gem.selected{border-color:#FFFFFF;transform:scale(1.08);box-shadow:0 0 12px rgba(255,255,255,0.6);z-index:2;}
.gem.targeted{border-color:#FFD700;box-shadow:0 0 16px rgba(255,215,0,0.7);}
.gem.removing{animation:gemRemove 0.3s ease forwards;}
@keyframes gemRemove{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:0.7}100%{transform:scale(0);opacity:0}}
.gem.falling{animation:gemFall 0.3s ease;}
@keyframes gemFall{0%{transform:translateY(-40px);opacity:0.5}100%{transform:translateY(0);opacity:1}}
.gem.swapping{animation:gemSwap 0.2s ease;}
@keyframes gemSwap{0%{transform:scale(0.8)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.gem.hint-pulse{animation:hintGlow 1s ease-in-out infinite;}
@keyframes hintGlow{
  0%{transform:scale(1);border-width:3px}
  25%{transform:scale(1.1);border-width:3px}
  50%{transform:scale(1);border-width:2px}
  75%{transform:scale(1.08);border-width:3px}
  100%{transform:scale(1);border-width:2px}
}/* Drag hint trail */
.gem.drag-source{opacity:0.5;transform:scale(0.9);}
.gem.drag-over{animation:gemSwap 0.2s ease;}
.idle-toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,215,0,0.92);color:#633806;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:50;pointer-events:none;animation:fadeInOut 3s ease forwards;}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(0.8)}}
/* Char bar */
/* Character bar */
.char-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px;}
.char-slot{
  background:#FFF;border-radius:10px;padding:6px 4px 4px;
  text-align:center;cursor:pointer;border:2px solid transparent;
  transition:all 0.2s;position:relative;min-height:64px;
}
.char-slot.ultimate-ready{animation:ultraPulse 1s infinite;border-color:#FFD700;}
@keyframes ultraPulse{0%,100%{box-shadow:0 0 4px #FFD700}50%{box-shadow:0 0 16px #FFD700}}
.char-skill-icon{font-size:22px;display:block;}
.char-lv{font-size:8px;color:#9B9B9B;}
.energy-wrap{height:4px;background:#E8E8E8;border-radius:2px;margin:3px 0;overflow:hidden;}
.energy-fill{height:100%;border-radius:2px;transition:width 0.3s;}
.energy-text{font-size:8px;color:#9B9B9B;}
.ultra-badge{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:#FFD700;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#633806;}

/* Actions */
.actions{display:flex;gap:8px;margin-bottom:8px;}
.btn{
  flex:1;padding:10px;border-radius:20px;border:none;font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.15s;text-align:center;
}
.btn:active{transform:scale(0.95);}
.btn-primary{background:linear-gradient(135deg,#7EC8E3,#5DB8D8);color:#FFF;}
.btn-primary:disabled{opacity:0.4;cursor:default;}
.btn-gold{background:linear-gradient(135deg,#FFD700,#FFB800);color:#633806;}
.btn-gold:disabled{opacity:0.4;cursor:default;}

/* Footer messages */
.footer-msg{text-align:center;font-size:12px;color:#9B9B9B;min-height:20px;padding:2px 0;}

/* Turn indicator */
.turn-indicator{text-align:center;font-size:11px;font-weight:600;padding:4px;border-radius:8px;margin-bottom:6px;}

/* Victory/Defeat overlay */
.overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.5);border-radius:28px;
  display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100;
}
.overlay.show{display:flex;}
.result-box{background:#FFF;border-radius:20px;padding:32px 40px;text-align:center;min-width:240px;}
.result-box h2{font-size:24px;margin-bottom:8px;}
.result-box p{font-size:14px;color:#666;margin-bottom:16px;}
.result-box .btn{margin-top:8px;}

@media(max-width:400px){
  .game-container{padding:10px;}
  .gem{border-radius:4px;font-size:14px;}
  .enemy-sprite{font-size:48px;}
}
</style>
</head>
<body>
<div class="game-container" id="app">
  <!-- Header -->
  <div class="header">
    <div class="player-info">
      <div class="avatar">⭐</div>
      <div><div class="player-name">星灵使者</div><div class="player-level">Lv.10</div></div>
    </div>
    <div class="currency">
      <span>🪙<b id="goldDisplay">999</b></span>
      <span>💎<b id="diamondDisplay">500</b></span>
    </div>
  </div>

  <!-- Player + Enemy area -->
  <div class="enemy-area" id="enemyArea">
    <!-- Shared player HP bar -->
    <div class="hp-bar-wrap" style="margin-bottom:6px;">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#4A4A4A;margin-bottom:1px;">
        <span>❤️ <b>星灵队</b></span>
        <span id="playerHPText">3000 / 3000</span>
      </div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="playerHPBar" style="width:100%;background:linear-gradient(90deg,#51CF66,#339AF0)"></div></div>
    </div>
    <div class="enemy-top">
      <div class="enemy-info">
        <div class="enemy-icon" style="background:#FAECE7;">🔥</div>
        <div><div class="enemy-name" id="enemyName">炎魔领主</div></div>
      </div>
      <div class="steps-box">
        <div class="steps-label">步数</div>
        <div class="steps-num" id="stepsDisplay">20</div>
      </div>
    </div>
    <div class="hp-bar-wrap">
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hpBar" style="width:100%"></div></div>
      <div class="hp-text" id="hpText">1000 / 1000</div>
    </div>
    <div class="enemy-portrait">
      <div class="enemy-sprite" id="enemySprite">👹</div>
    </div>
  </div>

  <!-- Turn indicator -->
  <div class="turn-indicator" id="turnIndicator" style="background:#E1F5EE;color:#0F6E56;">⚔ 选中两个相邻宝石交换位置，消除4个同色</div>

  <!-- Board -->
  <div class="board-wrap">
    <div class="status-row">
      <div class="score" id="scoreDisplay">得分: 0</div>
      <div class="combo" id="comboDisplay"></div>
    </div>
    <div class="board" id="board"></div>
  </div>

  <!-- Characters -->
  <div class="char-bar" id="charBar"></div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" id="endTurnBtn">▶ 结束回合</button>
    <button class="btn btn-gold" id="ultraBtn" disabled>✨ 释放大招</button>
  </div>

  <div class="footer-msg" id="footerMsg">交换宝石消除 → 每个宝石+10%能量 → 攒满100%可释放大招！</div>

  <!-- Result overlays -->
  <div class="overlay" id="victoryOverlay">
    <div class="result-box">
      <h2 style="color:#FFD700;">🎉 胜利！</h2>
      <p id="victoryMsg">恭喜击败敌人！</p>
      <button class="btn btn-primary" onclick="resetBattle()">再来一局</button>
    </div>
  </div>
  <div class="overlay" id="defeatOverlay">
    <div class="result-box">
      <h2 style="color:#E24B4A;">💀 败北</h2>
      <p>步数耗尽... 再试一次吧</p>
      <button class="btn btn-primary" onclick="resetBattle()">重新挑战</button>
    </div>
  </div>
</div>

<script>
// ==============================
// 星灵物语 · 战斗原型 v2 (交换模式)
// ==============================

const COLORS = ['#FF4444','#4488FF','#44CC88','#FFAA33','#AA66FF'];
const COLOR_ICONS = ['🔥','💧','🌪','🪨','✨'];
const COLOR_NAMES = ['炎','水','风','地','光'];
const ROWS = 8, COLS = 8;
const MIN_MATCH = 4;

// 4 个初始角色
const CHARACTERS = [
  { id:'fire', name:'星火·凛', icon:'🔥', color:0, atk:120, hp:800, skillName:'烈焰斩', ultraName:'红莲业火', skillEnergy:30, ultraEnergy:100, skillDmg:1.8, ultraDmg:4.5, skillDesc:'单体 1.8x 伤害', ultraDesc:'全体 4.5x 伤害' },
  { id:'water', name:'清波·瑶', icon:'💧', color:1, atk:60, hp:1000, skillName:'碧波之愈', ultraName:'生命之泉', skillEnergy:30, ultraEnergy:100, skillDmg:0, ultraDmg:0, skillDesc:'治疗最低血量队友 200', ultraDesc:'全体治疗 500' },
  { id:'wind', name:'疾风·翎', icon:'🌪', color:2, atk:90, hp:700, skillName:'疾风加持', ultraName:'天翔之翼', skillEnergy:30, ultraEnergy:100, skillDmg:0, ultraDmg:0, skillDesc:'全体攻击 +20%', ultraDesc:'额外 +5 步' },
  { id:'earth', name:'岩盾·磐', icon:'🪨', color:3, atk:70, hp:1500, skillName:'坚岩之盾', ultraName:'不破壁垒', skillEnergy:30, ultraEnergy:100, skillDmg:0, ultraDmg:0, skillDesc:'全体护盾 300', ultraDesc:'全体护盾 800' },
];

// State
let board = [];
let team = [];
let enemy = { name:'炎魔领主', maxHP:1000, hp:1000, atk:50 };
let playerHP = 3000, playerMaxHP = 3000;
let steps = 20;
let score = 0;
let comboCount = 0;
let gameOver = false;
let isPlayerTurn = true;
let isAnimating = false;

// Selection: clicked/tap first gem
let selectedGem = null; // { r, c }
// Drag state
let dragStart = null; // { r, c, x, y }
let isDragging = false;
const DRAG_THRESHOLD = 15; // px minimum to trigger drag
// Idle hint
let idleTimer = null;
let hintCells = null; // [{r,c},{r,c}] 高亮提示的可交换宝石对

// DOM refs
const boardEl = document.getElementById('board');
const charBarEl = document.getElementById('charBar');
const stepsEl = document.getElementById('stepsDisplay');
const hpBar = document.getElementById('hpBar');
const hpText = document.getElementById('hpText');
const scoreEl = document.getElementById('scoreDisplay');
const comboEl = document.getElementById('comboDisplay');
const enemySprite = document.getElementById('enemySprite');
const turnIndicator = document.getElementById('turnIndicator');
const footerMsg = document.getElementById('footerMsg');
const ultraBtn = document.getElementById('ultraBtn');
const endTurnBtn = document.getElementById('endTurnBtn');

// === Init ===
function init() {
  initBoard();
  initTeam();
  renderBoard();
  renderTeam();
  updateUI();
  updateTurnIndicator();
  ultraBtn.onclick = tryCastUltimate;
  endTurnBtn.onclick = endPlayerTurn;
  resetIdleTimer();
}

// === Board ===
function initBoard() {
  board = [];
  for (let r = 0; r < ROWS; r++) {
    board[r] = [];
    for (let c = 0; c < COLS; c++) {
      board[r][c] = { color: Math.floor(Math.random()*5), cleared: false, falling: false };
    }
  }
  // Ensure board is stable (no existing matches)
  while (findAllMatches().length > 0) {
    for (const match of findAllMatches()) {
      for (const [r, c] of match) {
        board[r][c].color = Math.floor(Math.random()*5);
      }
    }
  }
}

function initTeam() {
  team = CHARACTERS.map(c => ({
    ...c,
    energy: 0,
    maxEnergy: 100,
    skillCooldown: 0,
    shieldActive: false,
  }));
  window.windBuff = false;
  window.earthShield = false;
}

function renderBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const gem = document.createElement('div');
      gem.className = 'gem';
      const cell = board[r][c];
      if (cell.cleared) {
        gem.style.background = 'transparent';
        gem.textContent = '';
      } else {
        gem.style.background = COLORS[cell.color];
        gem.textContent = COLOR_ICONS[cell.color];
        gem.dataset.r = r;
        gem.dataset.c = c;
        gem.addEventListener('pointerdown', (e) => onGemPointerDown(e, r, c));
        if (cell.falling) {
          gem.classList.add('falling');
          setTimeout(() => { cell.falling = false; }, 300);
        }
        if (selectedGem && selectedGem.r === r && selectedGem.c === c) {
          gem.classList.add('selected');
        }
        // Hints
        if (hintCells && (
          (hintCells[0].r === r && hintCells[0].c === c) ||
          (hintCells[1].r === r && hintCells[1].c === c)
        )) {
          gem.classList.add('hint-pulse');
        }
      }
      boardEl.appendChild(gem);
    }
  }
}

function getGemEl(r, c) {
  return boardEl.children[r * COLS + c];
}

function clearAllHighlights() {
  const allGems = boardEl.children;
  for (let i = 0; i < allGems.length; i++) {
    allGems[i].classList.remove('selected');
  }
}

// === Swap-based interaction ===
// === Drag + Click interaction ===
// Pointer events on board container for drag tracking
boardEl.addEventListener('pointermove', (e) => {
  if (!dragStart || gameOver || !isPlayerTurn || isAnimating) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (!isDragging && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
    isDragging = true;
  }
  if (isDragging) {
    // Determine target adjacent gem based on primary drag direction
    let targetR = dragStart.r, targetC = dragStart.c;
    if (Math.abs(dx) > Math.abs(dy)) {
      targetC += dx > 0 ? 1 : -1;
    } else {
      targetR += dy > 0 ? 1 : -1; // dy>0=向下拖 row+1, dy<0=向上拖 row-1
    }
    // Visual: show drag direction on source gem
    const srcEl = getGemEl(dragStart.r, dragStart.c);
    if (srcEl && !srcEl.classList.contains('drag-source')) srcEl.classList.add('drag-source');
  }
});
document.addEventListener('pointerup', (e) => {
  if (!dragStart) return;
  const gr = dragStart.r, gc = dragStart.c;
  if (isDragging) {
    // Dragged — determine swap target
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
      let tr = gr, tc = gc;
      if (Math.abs(dx) > Math.abs(dy)) {
        tc += dx > 0 ? 1 : -1;
      } else {
        tr += dy > 0 ? 1 : -1;
      }
      // Clean up visual
      const srcEl = getGemEl(gr, gc);
      if (srcEl) srcEl.classList.remove('drag-source');
      // Attempt swap if valid cell
      if (tr >= 0 && tr < ROWS && tc >= 0 && tc < COLS && !board[tr][tc].cleared) {
        selectedGem = null;
        clearAllHighlights();
        resetIdleTimer();
        attemptSwap(gr, gc, tr, tc);
      }
    }
  }
  dragStart = null;
  isDragging = false;
});

function onGemPointerDown(e, r, c) {
  if (gameOver || !isPlayerTurn || isAnimating) return;
  if (board[r][c].cleared) return;
  e.preventDefault();
  // Record drag start
  dragStart = { r, c, x: e.clientX, y: e.clientY };
  isDragging = false;

  // Click behavior (non-drag)
  const onUp = (ev) => {
    document.removeEventListener('pointerup', onUp);
    if (isDragging) return; // handled by drag path
    // Clean hint state on any click
    clearHints();

    if (selectedGem === null) {
      // Select first gem
      selectedGem = { r, c };
      clearAllHighlights();
      const el = getGemEl(r, c);
      if (el) el.classList.add('selected');
      resetIdleTimer();
      footerMsg.textContent = `选中 ${COLOR_NAMES[board[r][c].color]} 宝石，可点击相邻或拖动交换`;
    } else {
      const first = selectedGem;
      if (first.r === r && first.c === c) {
        // Deselect
        selectedGem = null;
        clearAllHighlights();
        resetIdleTimer();
        footerMsg.textContent = `已取消选择`;
        return;
      }
      // Check if adjacent
      const dr = Math.abs(r - first.r);
      const dc = Math.abs(c - first.c);
      if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        selectedGem = null;
        resetIdleTimer();
        attemptSwap(first.r, first.c, r, c);
      } else {
        // Reselect
        selectedGem = { r, c };
        clearAllHighlights();
        const el = getGemEl(r, c);
        if (el) el.classList.add('selected');
        footerMsg.textContent = `不相邻，已重选 ${COLOR_NAMES[board[r][c].color]} 宝石`;
      }
    }
  };
  document.addEventListener('pointerup', onUp, { once: true });
}

// === Idle hint system ===
function resetIdleTimer() {
  if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
  clearHints();
  // Don't start timer if game over or not player's turn
  if (gameOver || !isPlayerTurn) return;
  // isAnimating is NOT checked here — let the timer fire and check at that time
  idleTimer = setTimeout(() => {
    if (gameOver || !isPlayerTurn || isAnimating) {
      // If still animating, re-schedule after 2s
      if (isAnimating && !gameOver) {
        idleTimer = setTimeout(showHint, 2000);
      }
      return;
    }
    showHint();
  }, 7000); // 7 seconds for prototype
}

function clearHints() {
  hintCells = null;
  // Reset all gems' hint styling
  for (let i = 0; i < boardEl.children.length; i++) {
    const el = boardEl.children[i];
    el.classList.remove('hint-pulse');
    if (el.style.animation.includes('hintGlow')) {
      el.style.animation = '';
      el.style.borderColor = 'transparent';
      el.style.boxShadow = '';
      el.style.zIndex = '';
    }
  }
  // Remove any idle toast
  const toast = document.querySelector('.idle-toast');
  if (toast) toast.remove();
}

function findValidSwap() {
  const shuffled = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!board[r][c].cleared) shuffled.push([r,c]);
  // Shuffle for variety
  for (let i = shuffled.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  for (const [r,c] of shuffled) {
    const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
    for (const [dr, dc] of dirs) {
      const nr = r+dr, nc = c+dc;
      if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS || board[nr][nc].cleared) continue;
      // Simulate swap
      const t = board[r][c].color;
      board[r][c].color = board[nr][nc].color;
      board[nr][nc].color = t;
      const ok = findAllMatches().length > 0;
      const t2 = board[r][c].color;
      board[r][c].color = board[nr][nc].color;
      board[nr][nc].color = t2;
      if (ok) return [{r,c}, {r:nr,c:nc}];
    }
  }
  return null;
}

function showHint() {
  const pair = findValidSwap();
  if (!pair) { footerMsg.textContent = '没有可交换的消除路径，洗牌中...'; shuffleBoard(); renderBoard(); resetIdleTimer(); return; }
  hintCells = pair;
  // Re-render board to ensure hint classes are applied properly
  renderBoard();
  // Apply per-gem colored glow via inline style (CSS can't see computed background)
  for (const {r,c} of pair) {
    const el = getGemEl(r,c);
    if (el) {
      const bg = window.getComputedStyle(el).backgroundColor || COLORS[board[r][c].color];
      el.style.borderColor = '#FFFFFF';
      el.style.setProperty('--glow-color', bg);
      el.style.animation = 'hintGlow 1s ease-in-out infinite';
      el.style.boxShadow = `0 0 30px 8px ${bg}`;
      el.style.zIndex = '5';
    }
  }
  // Also show a floating toast
  const toast = document.createElement('div');
  toast.className = 'idle-toast';
  toast.textContent = '✨ 试试交换这两个宝石！';
  const wrap = document.querySelector('.board-wrap');
  if (wrap) wrap.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
  const c0 = COLOR_NAMES[board[pair[0].r][pair[0].c].color];
  const c1 = COLOR_NAMES[board[pair[1].r][pair[1].c].color];
  footerMsg.textContent = `💡 ${c0}-${c1} 交换可消除！`;
}

async function attemptSwap(r1, c1, r2, c2) {
  isAnimating = true;
  const cell1 = board[r1][c1];
  const cell2 = board[r2][c2];

  // Swap in data
  const tempColor = cell1.color;
  cell1.color = cell2.color;
  cell2.color = tempColor;

  renderBoard();

  // Swap animation on both gems
  const el1 = getGemEl(r1, c1);
  const el2 = getGemEl(r2, c2);
  if (el1) el1.classList.add('swapping');
  if (el2) el2.classList.add('swapping');

  await delay(250);

  // Check if any match formed
  const matches = findAllMatches();
  if (matches.length > 0) {
    // Valid swap! Consume step and process matches
    steps--;
    updateUI();
    await processMatches(matches);
    
    // Check win/lose
    if (enemy.hp <= 0) { showVictory(); isAnimating = false; return; }
    if (steps <= 0) { showDefeat(); isAnimating = false; return; }

    // Enemy turn
    isPlayerTurn = false;
    updateTurnIndicator();
    await delay(500);
    enemyAttack();
    await delay(300);
    for (const char of team) { if (char.skillCooldown > 0) char.skillCooldown--; }
    renderTeam();
    isPlayerTurn = true;
    updateTurnIndicator();
    footerMsg.textContent = `剩余 ${steps} 步，消除积攒能量！队员能量满时可点击释放大招`;

    // Check no valid moves
    if (!hasAnyValidSwap()) {
      shuffleBoard(); renderBoard();
      footerMsg.textContent = '🔄 棋盘已洗牌！';
    }
  } else {
    // Invalid swap — swap back
    const tempC = cell1.color;
    cell1.color = cell2.color;
    cell2.color = tempC;
    renderBoard();

    // Shake animation to indicate invalid
    if (el1) el1.style.borderColor = '#FF4444';
    if (el2) el2.style.borderColor = '#FF4444';
    await delay(200);
    if (el1) el1.style.borderColor = 'transparent';
    if (el2) el2.style.borderColor = 'transparent';

    footerMsg.textContent = '❌ 交换后无法形成4连消除，请再试试！';
  }

  isAnimating = false;
  resetIdleTimer();
}

// === Match processing ===
async function processMatches(matches) {
  // Deduplicate cells
  const allCells = new Set();
  for (const match of matches) {
    for (const [r, c] of match) allCells.add(`${r},${c}`);
  }
  const cellList = [...allCells].map(s => s.split(',').map(Number));

  // Determine primary color (use first match's color)
  const firstR = matches[0][0][0], firstC = matches[0][0][1];
  const matchColor = board[firstR][firstC].color;

  // Count total matched gems
  const count = cellList.length;

  // Animate clear
  for (const [r, c] of cellList) {
    const el = getGemEl(r, c);
    if (el) el.classList.add('removing');
  }
  await delay(300);

  // Remove from board
  for (const [r, c] of cellList) {
    board[r][c].cleared = true;
    board[r][c].color = 0;
  }

  // Combo
  comboCount++;

  // Calculate damage
  const dmg = calculateDamage(count, matchColor);
  damageEnemy(dmg);
  showDamageFloat(dmg);

  // Energy
  const energyGained = count * 10; // each gem = 10% energy
  distributeEnergy(matchColor, energyGained);

  // Score
  const comboMult = 1 + (comboCount - 1) * 0.2;
  score += Math.floor(count * 10 * comboMult);

  // Combo display
  if (comboCount > 1) {
    comboEl.textContent = `⚡ ${comboCount}x 连击！`;
    comboEl.classList.remove('active');
    void comboEl.offsetWidth;
    comboEl.classList.add('active');
    setTimeout(() => comboEl.classList.remove('active'), 400);
  }

  // Auto skills
  checkAutoSkills();
  updateUI();

  // Gravity
  applyGravity();
  renderBoard();
  await delay(300);

  // Chain matches
  const chainMatches = findAllMatches();
  if (chainMatches.length > 0) {
    footerMsg.textContent = `🔥 连锁消除！继续！`;
    await processMatches(chainMatches);
  } else {
    comboCount = 0;
    comboEl.textContent = '';
  }
}

function calculateDamage(count, color) {
  const char = team.find(c => c.color === color);
  const atk = char ? char.atk * (1 + char.attackBuff/100) : 100;
  // More gems = more damage
  return Math.floor(atk * 0.18 * count);
}

function damageEnemy(dmg) {
  const actualDmg = Math.max(1, Math.min(dmg, enemy.hp));
  enemy.hp -= actualDmg;
  if (enemy.hp < 0) enemy.hp = 0;
  updateUI();
  enemySprite.classList.remove('hit');
  void enemySprite.offsetWidth;
  enemySprite.classList.add('hit');
  return actualDmg;
}

function showDamageFloat(dmg) {
  if (dmg <= 0) return;
  const el = document.createElement('div');
  el.className = 'dmg-float';
  el.textContent = `-${dmg}`;
  el.style.left = '50%';
  el.style.top = '30%';
  el.style.transform = 'translateX(-50%)';
  document.getElementById('enemyArea').appendChild(el);
  setTimeout(() => el.remove(), 1000);
}

function distributeEnergy(color, amount) {
  for (const char of team) {
    if (char.color === color) {
      char.energy = Math.min(char.maxEnergy, char.energy + amount);
    }
  }
  renderTeam();
}

// === Match detection (horizontal + vertical, >= MIN_MATCH) ===
function findAllMatches() {
  const matches = [];
  // Horizontal
  for (let r = 0; r < ROWS; r++) {
    let start = 0;
    for (let c = 1; c <= COLS; c++) {
      if (c < COLS && !board[r][c].cleared && !board[r][start].cleared && board[r][c].color === board[r][start].color) continue;
      const len = c - start;
      if (len >= MIN_MATCH && !board[r][start].cleared) {
        const m = [];
        for (let i = start; i < c; i++) m.push([r, i]);
        matches.push(m);
      }
      start = c;
    }
  }
  // Vertical
  for (let c = 0; c < COLS; c++) {
    let start = 0;
    for (let r = 1; r <= ROWS; r++) {
      if (r < ROWS && !board[r][c].cleared && !board[start][c].cleared && board[r][c].color === board[start][c].color) continue;
      const len = r - start;
      if (len >= MIN_MATCH && !board[start][c].cleared) {
        const m = [];
        for (let i = start; i < r; i++) m.push([i, c]);
        matches.push(m);
      }
      start = r;
    }
  }
  return matches;
}

// === Gravity ===
function applyGravity() {
  for (let c = 0; c < COLS; c++) {
    let writeRow = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (!board[r][c].cleared) {
        if (r !== writeRow) {
          board[writeRow][c] = { ...board[r][c], falling: true };
          board[r][c] = { color: 0, cleared: true, falling: false };
        }
        writeRow--;
      }
    }
    for (let r = writeRow; r >= 0; r--) {
      board[r][c] = { color: Math.floor(Math.random()*5), cleared: false, falling: true };
    }
  }
}

// === Check if any valid swap exists ===
function hasAnyValidSwap() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = board[r][c];
      if (cell.cleared) continue;
      // Try swap with each neighbor
      const dirs = [[0,1],[1,0]];
      for (const [dr, dc] of dirs) {
        const nr = r+dr, nc = c+dc;
        if (nr >= ROWS || nc >= COLS) continue;
        const neighbor = board[nr][nc];
        if (neighbor.cleared) continue;
        // Simulate swap
        const temp = cell.color;
        cell.color = neighbor.color;
        neighbor.color = temp;
        const hasMatch = findAllMatches().length > 0;
        // Swap back
        const temp2 = cell.color;
        cell.color = neighbor.color;
        neighbor.color = temp2;
        if (hasMatch) return true;
      }
    }
  }
  return false;
}

function shuffleBoard() {
  const colors = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!board[r][c].cleared) colors.push(board[r][c].color);
  for (let i = colors.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [colors[i], colors[j]] = [colors[j], colors[i]];
  }
  let idx = 0;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (!board[r][c].cleared) board[r][c].color = colors[idx++];
  // Ensure valid swaps exist after shuffle
  while (!hasAnyValidSwap()) shuffleBoard();
}

// === Team / Skills ===
function renderTeam() {
  charBarEl.innerHTML = '';
  for (const char of team) {
    const slot = document.createElement('div');
    slot.className = 'char-slot';
    const full = char.energy >= char.maxEnergy;
    if (full) slot.classList.add('ultimate-ready');
    const pct = Math.round(char.energy / char.maxEnergy * 100);
    slot.innerHTML = `
      <span class="char-skill-icon">${char.icon}</span>
      <div class="char-lv">${char.name}</div>
      <div class="energy-wrap"><div class="energy-fill" style="width:${pct}%;background:${COLORS[char.color]}"></div></div>
      <div class="energy-text">${full ? '★ READY ★' : pct + '%'}</div>
      <div class="ultra-badge" style="display:${full?'flex':'none'}">!</div>
    `;
    slot.onclick = () => onCharClick(char);
    charBarEl.appendChild(slot);
  }
}
    slot.onclick = () => onCharClick(char);
    charBarEl.appendChild(slot);
  }
}

function onCharClick(char) {
  if (!isPlayerTurn || gameOver || isAnimating) return;
  if (char.energy >= char.maxEnergy) { castUltimate(char); return; }
  if (char.energy >= 30 && char.skillCooldown <= 0) { castNormalSkill(char); return; }
  footerMsg.textContent = `${char.name} 能量 ${Math.round(char.energy)}%，${char.skillCooldown>0?'冷却中 '+char.skillCooldown+'回合':'小技能需要30%'}`;
}

function checkAutoSkills() {
  for (const char of team) {
    if (char.energy >= 30 && char.skillCooldown <= 0) castNormalSkill(char);
  }
  renderTeam();
}

function castNormalSkill(char) {
  char.energy -= 30;
  char.skillCooldown = 2;
  if (char.skillDmg > 0) {
    const d = Math.floor(char.atk * char.skillDmg);
    damageEnemy(d); showDamageFloat(d);
  }
  if (char.id === 'water') {
    const heal = 300;
    playerHP = Math.min(playerMaxHP, playerHP + heal);
    updateUI();
    footerMsg.textContent = `${char.name} 释放了【${char.skillName}】! 恢复 ${heal} 点生命`;
    return;
  }
  if (char.id === 'wind') {
    // +20% attack buff (simplified: next damage deals 1.2x)
    window.windBuff = true;
    footerMsg.textContent = `${char.name} 释放了【${char.skillName}】! 下次伤害 x1.2`;
    return;
  }
  if (char.id === 'earth') {
    char.shieldActive = true;
    footerMsg.textContent = `${char.name} 释放了【${char.skillName}】! 下次受伤减半`;
    setTimeout(() => { char.shieldActive = false; }, 30000); // lasts until next enemy hit + timeout
    renderTeam();
    return;
  }
  footerMsg.textContent = `${char.name} 释放了【${char.skillName}】! ${char.skillDesc}`;
  renderTeam(); updateUI();
}

function castUltimate(char) {
  char.energy = 0;
  if (char.ultraDmg > 0) {
    let d = Math.floor(char.atk * char.ultraDmg);
    if (window.windBuff) { d = Math.floor(d * 1.2); window.windBuff = false; }
    damageEnemy(d); showDamageFloat(d);
  }
  if (char.id === 'water') {
    playerHP = Math.min(playerMaxHP, playerHP + 800);
    updateUI();
  }
  if (char.id === 'wind') { steps += 5; updateUI(); }
  if (char.id === 'earth') { window.earthShield = true; footerMsg.textContent = `${char.name} 大招【不破壁垒】! 下次伤害大幅降低`; }
  if (char.ultraDmg > 0 || char.id === 'water') {
    // flash
    const gc = document.querySelector('.game-container');
    gc.style.transition = 'background 0.1s';
    gc.style.background = '#FFFFFF';
    setTimeout(() => gc.style.background = '', 150);
  }
  renderTeam(); updateUI();
  if (enemy.hp <= 0) setTimeout(showVictory, 500);
}

function tryCastUltimate() {
  const ready = team.find(c => c.energy >= c.maxEnergy);
  if (ready) { castUltimate(ready); ultraBtn.disabled = true; }
  else { footerMsg.textContent = '没有角色能量满！'; }
}

// === Enemy ===
function enemyAttack() {
  if (enemy.hp <= 0) return;
  let dmg = Math.max(5, enemy.atk - 5 + Math.floor(Math.random() * 20));
  // Shield from earth character provides party-wide damage reduction
  const earthChar = team.find(c => c.id === 'earth');
  if (earthChar && earthChar.shieldActive) {
    dmg = Math.max(1, Math.floor(dmg * 0.5));
  }
  playerHP = Math.max(0, playerHP - dmg);
  updateUI();
  footerMsg.textContent = `👹 ${enemy.name} 攻击了星灵队，-${dmg} HP (剩余 ${playerHP})`;
  // Flash player HP bar
  const pBar = document.getElementById('playerHPBar');
  if (pBar) { pBar.style.transition = 'none'; pBar.style.background = '#FF6B6B'; setTimeout(() => { pBar.style.transition = ''; pBar.style.background = ''; }, 200); }
  if (playerHP <= 0) { setTimeout(showDefeat, 500); }
}

function endPlayerTurn() {
  if (!isPlayerTurn || gameOver || isAnimating) return;
  isPlayerTurn = false; steps--; updateUI();
  if (steps <= 0 && enemy.hp > 0) { showDefeat(); return; }
  if (enemy.hp <= 0) { showVictory(); return; }
  enemyAttack();
  for (const char of team) { if (char.skillCooldown > 0) char.skillCooldown--; }
  renderTeam();
  setTimeout(() => {
    isPlayerTurn = true; updateTurnIndicator();
    resetIdleTimer();
    footerMsg.textContent = `剩余 ${steps} 步，交换宝石消除！`;
  }, 500);
}

// === UI ===
function updateUI() {
  if (stepsEl) stepsEl.textContent = steps;
  const pct = enemy.hp/enemy.maxHP*100;
  hpBar.style.width = pct+'%';
  hpText.textContent = `${enemy.hp} / ${enemy.maxHP}`;
  scoreEl.textContent = `得分: ${score}`;
  // Player HP
  const ppct = playerHP / playerMaxHP * 100;
  document.getElementById('playerHPBar').style.width = ppct + '%';
  document.getElementById('playerHPText').textContent = `${playerHP} / ${playerMaxHP}`;
  ultraBtn.disabled = !team.some(c => c.energy >= c.maxEnergy);
}

function updateTurnIndicator() {
  if (gameOver) return;
  if (isPlayerTurn) {
    turnIndicator.style.background = '#E1F5EE';
    turnIndicator.style.color = '#0F6E56';
    turnIndicator.textContent = '⚔ 玩家回合 — 交换宝石消除，积攒能量放大招';
  } else {
    turnIndicator.style.background = '#FCEBEB';
    turnIndicator.style.color = '#A32D2D';
    turnIndicator.textContent = '🔄 敌人回合中...';
  }
}

function showVictory() {
  gameOver = true;
  document.getElementById('victoryOverlay').classList.add('show');
  document.getElementById('victoryMsg').textContent = `通关！⭐ 得分: ${score} 剩余步数: ${steps} 剩余血量: ${playerHP}/${playerMaxHP}`;
}

function showDefeat() {
  gameOver = true;
  document.getElementById('defeatOverlay').classList.add('show');
}

function resetBattle() {
  document.getElementById('victoryOverlay').classList.remove('show');
  document.getElementById('defeatOverlay').classList.remove('show');
  enemy.hp = enemy.maxHP; playerHP = playerMaxHP; steps = 20; score = 0; comboCount = 0;
  gameOver = false; isPlayerTurn = true; isAnimating = false; selectedGem = null;
  initBoard(); initTeam(); renderBoard(); renderTeam(); updateUI();
  updateTurnIndicator();
  resetIdleTimer();
  footerMsg.textContent = '重新开始！交换宝石击败敌人！';
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

init();
</script>
