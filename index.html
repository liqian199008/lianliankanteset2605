<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>星灵物语 · 原神素材版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;min-height:100vh;display:flex;justify-content:center;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:10px;touch-action:none;user-select:none}
.game-container{width:100%;max-width:420px;background:linear-gradient(180deg,#FFF8F0,#F0E6D8);border-radius:28px;padding:12px 12px 4px;box-shadow:0 8px 40px rgba(0,0,0,0.3);position:relative;overflow:hidden}
.header{margin-bottom:4px}
.player-info{display:none}
.currency{display:flex;gap:12px;font-size:12px;color:#4A4A4A}.currency span{display:flex;align-items:center;gap:3px}
.enemy-area{background:#FFF;border-radius:16px;margin-bottom:6px;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:relative;overflow:hidden;height:96px}.enemy-img{width:100%;height:100%;object-fit:cover;display:block}.enemy-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px}.enemy-top{display:flex;justify-content:space-between;align-items:flex-start}.enemy-info{display:flex;align-items:center;gap:6px}.enemy-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#FFF}.enemy-name{font-size:13px;font-weight:600;color:#FFF;text-shadow:0 1px 4px rgba(0,0,0,0.6)}.steps-box{background:rgba(0,0,0,0.5);border-radius:8px;padding:4px 10px;text-align:center;backdrop-filter:blur(4px)}.steps-label{font-size:8px;color:#FFD700}.steps-num{font-size:18px;font-weight:700;color:#FFD700;line-height:1.2}.hp-overlay{padding:0 4px}.hp-bar-bg{height:8px;background:rgba(0,0,0,0.3);border-radius:4px;overflow:hidden;backdrop-filter:blur(2px)}.hp-bar-fill{height:100%;border-radius:4px;transition:width 0.4s ease}.hp-text{font-size:10px;color:#FFF;text-shadow:0 1px 3px rgba(0,0,0,0.5);text-align:right;margin-top:1px}

.enemy-info{display:flex;align-items:center;gap:10px}.enemy-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px}
.enemy-name{font-size:14px;font-weight:600;color:#4A4A4A}
.hp-bar-wrap{margin-bottom:6px}
.hp-bar-bg{height:10px;background:#FCEBEB;border-radius:5px;overflow:hidden}
.hp-bar-fill{height:100%;border-radius:5px;transition:width 0.4s ease}
.hp-text{font-size:12px;color:#9B9B9B;white-space:nowrap}
.steps-box{background:#FAEEDA;border-radius:10px;padding:6px 14px;text-align:center;border:1px solid #FAC775}
.steps-label{font-size:9px;color:#854F0B}.steps-num{font-size:20px;font-weight:700;color:#854F0B;line-height:1.2}
.enemy-portrait{text-align:center;padding:6px 0 0;position:relative;min-height:80px}
.enemy-area.hit{animation:hitShake 0.3s}.dmg-float{position:absolute;font-size:28px;font-weight:800;color:#F44;pointer-events:none;animation:floatUp 0.9s ease-out forwards;z-index:10}.dmg-float.crit{font-size:36px;color:#FFD700;text-shadow:0 0 10px rgba(255,215,0,0.5)}@keyframes floatUp{0%{opacity:1;transform:translateY(0)}50%{transform:translateY(-30px)}100%{opacity:0;transform:translateY(-60px)}}
@keyframes hitShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dmg-float{position:absolute;font-size:28px;font-weight:800;color:#F44;pointer-events:none;animation:floatUp 0.9s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-60px)}}
.board-wrap{background:#F9F6F0;border-radius:16px;padding:8px;margin-bottom:8px;box-shadow:inset 0 2px 6px rgba(0,0,0,0.06);position:relative}
.status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;padding:0 4px}
.score{font-size:13px;font-weight:600;color:#4A4A4A}.combo{font-size:13px;font-weight:700;color:#FF6B9D;min-height:20px}
.combo.active{animation:comboPop 0.3s}
@keyframes comboPop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;aspect-ratio:1;min-height:280px;position:relative}
.gem{border-radius:6px;cursor:pointer;transition:all 0.12s ease;display:flex;align-items:center;justify-content:center;font-size:18px;aspect-ratio:1;min-height:0;position:relative;overflow:hidden}
.gem::after{content:'';position:absolute;inset:0;border-radius:6px;pointer-events:none;z-index:2;box-shadow:inset 0 0 0 1px #999}
.gem.selected::after{box-shadow:inset 0 0 0 1px #FFF,0 0 12px rgba(255,255,255,0.6)!important}
.gem.selected{transform:scale(1.08);z-index:3}
.gem.removing{animation:gemRemove 0.6s ease forwards}
@keyframes gemRemove{0%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:0.7}100%{transform:scale(0);opacity:0}}
.gem.falling{animation:gemFall 1.3s ease}
@keyframes gemFall{0%{transform:translateY(-80px);opacity:0.3}100%{transform:translateY(0);opacity:1}}
.gem.hint-pulse{animation:hintGlow 1s ease-in-out infinite;z-index:4!important}
@keyframes hintGlow{0%{transform:scale(1);box-shadow:inset 0 0 0 2px #FFF,0 0 8px var(--hint-glow),0 0 20px var(--hint-glow)}50%{transform:scale(1.15);box-shadow:inset 0 0 0 3px #FFF,0 0 20px var(--hint-glow),0 0 40px #FFF}100%{transform:scale(1);box-shadow:inset 0 0 0 2px #FFF,0 0 8px var(--hint-glow),0 0 20px var(--hint-glow)}}
@keyframes bombBoom{0%{transform:scale(0);opacity:1}40%{transform:scale(2);opacity:0.8}100%{transform:scale(3.5);opacity:0}}
@keyframes flashPop{0%{opacity:0}15%{opacity:1}30%{opacity:1}100%{opacity:0}}
@keyframes floatRight{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(30px)}}
.char-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-bottom:6px}
.char-slot{background:#FFF;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:all 0.2s;position:relative;overflow:hidden;display:flex;flex-direction:column;height:100px}
.char-slot.ultimate-ready{animation:ultraPulse 1s infinite;border-color:#FFD700}
@keyframes ultraPulse{0%,100%{box-shadow:0 0 4px #FFD700}50%{box-shadow:0 0 16px #FFD700}}
.char-portrait{flex:1;overflow:hidden}
.char-portrait img{width:100%;height:100%;object-fit:cover;display:block}
.char-bottom{position:relative;height:10px;background:#F5F5F5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.char-lv{position:relative;font-size:7px;font-weight:600;color:#4A4A4A;z-index:2;line-height:1}
.energy-wrap{display:flex;gap:2px;position:absolute;inset:2px 3px}
.energy-fill{flex:1;border-radius:2px;transition:background 0.3s}
.ultra-badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 4px;background:#FFD700;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#633806;z-index:3;white-space:nowrap}
.footer-msg{text-align:center;font-size:12px;color:#9B9B9B;min-height:12px;padding:1px 0;margin-top:2px}
.player-area.hit{animation:playerHit 0.8s ease}
@keyframes playerHit{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px)}30%{transform:translateX(5px)}45%{transform:translateX(-4px)}60%{transform:translateX(4px)}75%{transform:translateX(-2px)}90%{transform:translateX(2px)}}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);border-radius:28px;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}.result-box{background:#FFF;border-radius:20px;padding:32px 40px;text-align:center;min-width:240px}
.result-box h2{font-size:24px;margin-bottom:8px}.result-box p{font-size:14px;color:#666;margin-bottom:16px}
.result-box .btn{margin-top:8px;padding:10px 32px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,#7EC8E3,#5DB8D8);color:#FFF}
.rank-list{text-align:left;margin:10px 0;padding:0;list-style:none;font-size:13px;max-height:220px;overflow-y:auto;min-width:200px}
.rank-list li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:4px;margin-bottom:2px}
.rank-list li.current{background:#FFF3CD;font-weight:700}
.rank-medal{font-size:18px;min-width:24px;text-align:center}
.rank-num{min-width:24px;text-align:center;color:#999;font-weight:600}
.rank-score{flex:1;text-align:right;font-weight:600}
.rank-hp{font-size:11px;color:#999;margin-left:6px}
.your-rank{font-size:14px;font-weight:700;color:#E24B4A;margin:4px 0 8px}
@media(max-width:400px){.game-container{padding:10px}.gem{border-radius:4px}.enemy-sprite{font-size:40px}}
</style>
</head>
<body>
<div class="game-container" id="app">

 
<div class="enemy-area" id="enemyArea">
  <img class="enemy-img" src="assets/boss.png">
  <div class="enemy-overlay">
    <div class="enemy-top">
      <div></div>
      <div class="steps-box"><div class="steps-label">步数</div><div class="steps-num" id="stepsDisplay">15</div></div>
    </div>
    <div class="hp-overlay">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
        <span style="font-size:16px;font-weight:700;color:#FFF;text-shadow:0 1px 4px rgba(0,0,0,0.8)">博士</span>
        <span class="hp-text" id="hpText" style="font-size:10px;color:#FFF;text-shadow:0 1px 3px rgba(0,0,0,0.5)">10000 / 10000</span>
      </div>
      <div class="hp-bar-bg"><div class="hp-bar-fill" id="hpBar" style="width:100%;background:linear-gradient(90deg,#E24B4A,#FF6B6B)"></div></div>
    </div>
  </div>
</div>

<div class="board-wrap">
  <div class="status-row"><div class="score" id="scoreDisplay">得分: 0</div><div class="combo" id="comboDisplay"></div></div>
  <div class="board" id="board"></div>
</div>

<div class="player-area" id="playerArea">
<div class="char-bar" id="charBar"></div>

<div class="hp-bar-wrap" style="margin-bottom:0">
  <div style="display:flex;justify-content:space-between;font-size:10px;color:#4A4A4A;margin-bottom:1px"><span><b>旅行者</b> Lv.10</span><span id="playerHPText">2000 / 2000</span></div>
  <div class="hp-bar-bg" style="position:relative">
    <div class="hp-bar-fill" id="shieldBar" style="position:absolute;inset:0;width:0%;background:rgba(255,215,0,0.6);transition:width 0.4s ease;z-index:3;box-shadow:0 0 6px rgba(255,215,0,0.3)"></div>
    <div class="hp-bar-fill" id="playerHPBar" style="width:100%;background:linear-gradient(90deg,#51CF66,#339AF0);position:relative;z-index:2"></div>
  </div>
</div>
</div>

<div class="footer-msg" id="footerMsg">交换元素图标消除积攒能量, 能量满后点击头像释放元素爆发</div>

<div class="overlay" id="victoryOverlay"><div class="result-box"><h2>胜利</h2><p id="victoryMsg">恭喜通关</p><div class="your-rank" id="yourRank"></div><ul class="rank-list" id="rankList"></ul><button class="btn" onclick="resetBattle()">再来一局</button></div></div>
<div class="overlay" id="defeatOverlay"><div class="result-box"><h2>败北</h2><p>步数耗尽, 再试一次</p><button class="btn" onclick="resetBattle()">重新挑战</button></div></div>

<!-- 预加载语音 -->
<audio id="sfx_klee" preload="auto" src="voice/klee_burst.mp3"></audio>
<audio id="sfx_barbara" preload="auto" src="voice/barbara_burst.mp3"></audio>
<audio id="sfx_xianyun" preload="auto" src="voice/xianyun_burst.mp3"></audio>
<audio id="sfx_zhongli" preload="auto" src="voice/zhongli_burst.mp3"></audio>
<!-- 打击音效 -->
<audio id="sfx_hitBoss" preload="auto" src="assets/hit_boss.wav"></audio>
<audio id="sfx_hitPlayer" preload="auto" src="assets/hit_player.wav"></audio>
<!-- 胜利音效 -->
<audio id="sfx_victory" preload="auto" src="assets/victory.wav"></audio>
<!-- 战斗BGM -->
<audio id="bgm_battle" loop preload="auto" src="voice/bgm_battle.mp3"></audio>

</div>

<script>
const IMG_PATH = 'assets/';
const GEM_IMGS = ['gem_fire.png','gem_water.png','gem_wind.png','gem_rock.png'];
const CHAR_IMGS = ['char_fire.png','char_water.png','char_wind.png','char_rock.png'];
const ICE_IMG = 'ice.png';
const BG = ['#FFE8E8','#E8F0FF','#E8FFF0','#FFF8E8'];
const BD = ['#FF4444','#4488FF','#44CC88','#FFAA33'];
const TEAM_COLORS = [0,1,2,3];
const ICE_COLOR = 4;

const CHARS = [
  {id:'klee',name:'可莉',color:0,atk:120,skillDmg:1.8,ultraDmg:18.0,readyTxt:'开火'},
  {id:'barbara',name:'芭芭拉',color:1,atk:60,skillDmg:0,ultraDmg:0,readyTxt:'吃药啦'},
  {id:'xianyun',name:'闲云',color:2,atk:90,skillDmg:0,ultraDmg:0,readyTxt:'飞起来'},
  {id:'zhongli',name:'钟离',color:3,atk:70,skillDmg:0,ultraDmg:0,readyTxt:'护驾'},
];

let board=[],team=[],steps=15,score=0,comboCount=0;
let enemy={name:'博士',maxHP:10000,hp:10000,atk:300};
let playerHP=2000,playerMaxHP=2000,playerShield=0;
let gameOver=false,isPlayerTurn=true,isAnimating=false;
let selectedGem=null,dragStart=null,isDragging=false;
let idleTimer=null,hintCells=null;
const D_TH=15,B=8,M=4;

const boardEl=document.getElementById('board');
const charBarEl=document.getElementById('charBar');
const stepsEl=document.getElementById('stepsDisplay');
const hpBar=document.getElementById('hpBar');
const hpText=document.getElementById('hpText');
const scoreEl=document.getElementById('scoreDisplay');
const comboEl=document.getElementById('comboDisplay');
const footerMsg=document.getElementById('footerMsg');

window.addEventListener('error',function(e){footerMsg.textContent='⚠ '+e.message;console.error(e.error);return true;});
window.addEventListener('unhandledrejection',function(e){footerMsg.textContent='⚠ 异步错误: '+(e.reason?.message||e.reason);console.error(e.reason);e.preventDefault();});

function init(){try{
  initBoard();initTeam();renderBoard();}catch(e){footerMsg.textContent='init错误:'+e.message;return;}
  renderTeam();updateUI();resetIdleTimer();if(speechUnlocked)startBGM();
}

function initBoard(){
  board=[];for(let r=0;r<B;r++){
    board[r]=[];for(let c=0;c<B;c++)board[r][c]={color:TEAM_COLORS[Math.random()*4|0],cleared:0,falling:0};
    // 每行保证1个冰块
    const ic=Math.random()*B|0;board[r][ic]={color:ICE_COLOR,cleared:0,falling:0};
  }
  while(findAll().length>0)for(const m of findAll())for(const[r,c]of m)board[r][c].color=TEAM_COLORS[Math.random()*4|0];
}
function initTeam(){team=CHARS.map(c=>({...c,energy:0,maxEnergy:100,skillCooldown:0,shieldActive:0}));}

function renderBoard(){
  // 修复线程安全的异常格子
  for(let r=0;r<B;r++)for(let c=0;c<B;c++){
    const cell=board[r][c];
    if(!cell||cell.cleared){board[r][c]={color:TEAM_COLORS[Math.random()*4|0],cleared:0,falling:1};}
  }
  boardEl.innerHTML='';
  for(let r=0;r<B;r++)for(let c=0;c<B;c++){
    const g=document.createElement('div');g.className='gem';
    const cell=board[r][c];
    if(cell.cleared){g.style.background='transparent';}
    else if(cell.color===ICE_COLOR){
      g.style.background='#E8F4FF';
      g.innerHTML='<img src="'+IMG_PATH+ICE_IMG+'" style="width:100%;height:100%;object-fit:cover">';
      g.dataset.r=r;g.dataset.c=c;
    }else{
      const ci=cell.color;
      g.style.background=BG[ci];
      g.innerHTML='<img src="'+IMG_PATH+GEM_IMGS[ci]+'" style="width:100%;height:100%;object-fit:cover">';
      g.dataset.r=r;g.dataset.c=c;
      if(cell.falling){g.classList.add('falling');cell.falling=0;}
      if(selectedGem&&selectedGem.r===r&&selectedGem.c===c)g.classList.add('selected');
      if(hintCells&&((hintCells[0].r===r&&hintCells[0].c===c)||(hintCells[1].r===r&&hintCells[1].c===c))){
        g.classList.add('hint-pulse');g.style.setProperty('--hint-glow',BD[ci]);g.style.zIndex='5';
      }
    }
    boardEl.appendChild(g);
  }
}
function gem(r,c){return boardEl.children[r*B+c];}

boardEl.onpointerdown=(e)=>{
  const gem=e.target.closest('.gem');
  if(!gem||!gem.dataset.r)return;
  const r=+gem.dataset.r,c=+gem.dataset.c;
  // 卡死恢复：如果animating卡住超过10s则强制恢复
  if(isAnimating){footerMsg.textContent='⚠ 动画卡住,点击尝试恢复...';isAnimating=0;isPlayerTurn=1;resetIdleTimer();}
  if(gameOver||!isPlayerTurn||isAnimating||board[r][c].cleared||board[r][c].color===ICE_COLOR)return;
  dragStart={r,c,x:e.clientX,y:e.clientY};isDragging=0;
  gem.setPointerCapture(e.pointerId);
};

let dragMove=(e)=>{
  if(!dragStart||gameOver||!isPlayerTurn||isAnimating)return;
  const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
  if(Math.abs(dx)>D_TH||Math.abs(dy)>D_TH)isDragging=1;
};
let dragEnd=(e)=>{
  if(!dragStart)return;
  const r=dragStart.r,c=dragStart.c;
  if(isDragging){
    selectedGem=null;clearHints();
    const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;
    if(Math.abs(dx)>D_TH||Math.abs(dy)>D_TH){
      let tr=r,tc=c;
      if(Math.abs(dx)>Math.abs(dy))tc+=dx>0?1:-1;else tr+=dy>0?1:-1;
      if(tr>=0&&tr<B&&tc>=0&&tc<B&&!board[tr][tc].cleared&&board[tr][tc].color!==ICE_COLOR){resetIdleTimer();trySwap(r,c,tr,tc);}
    }
  }else{
    clearHints();
    if(selectedGem===null){
      selectedGem={r,c};renderBoard();resetIdleTimer();footerMsg.textContent='已选中, 点相邻或拖动交换';
    }else{
      const f=selectedGem;
      if(f.r===r&&f.c===c){selectedGem=null;renderBoard();footerMsg.textContent='已取消';}
      else{
        const dr=Math.abs(r-f.r),dc=Math.abs(c-f.c);
        if((dr===1&&dc===0)||(dr===0&&dc===1)){selectedGem=null;resetIdleTimer();trySwap(f.r,f.c,r,c);}
        else{selectedGem={r,c};renderBoard();footerMsg.textContent='不相邻, 已重选';}
      }
    }
  }
  dragStart=null;isDragging=0;
};
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',dragEnd);

function resetIdleTimer(){
  if(idleTimer){clearTimeout(idleTimer);idleTimer=null;}clearHints();
  if(gameOver||!isPlayerTurn)return;
  idleTimer=setTimeout(()=>{
    if(gameOver||!isPlayerTurn||isAnimating){if(isAnimating&&!gameOver)idleTimer=setTimeout(showHint,2000);return;}
    showHint();
  },5000);
}
function clearHints(){
  hintCells=null;
  for(let i=0;i<boardEl.children.length;i++){const el=boardEl.children[i];el.classList.remove('hint-pulse');el.style.removeProperty('--hint-glow');el.style.zIndex='';}
}
function findSwap(){
  const cells=[];for(let r=0;r<B;r++)for(let c=0;c<B;c++)if(!board[r][c].cleared&&board[r][c].color!==ICE_COLOR)cells.push([r,c]);
  for(let i=cells.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[cells[i],cells[j]]=[cells[j],cells[i]];}
  for(const[r,c]of cells){const dirs=[[0,1],[1,0],[0,-1],[-1,0]];
    for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(nr<0||nr>=B||nc<0||nc>=B||board[nr][nc].cleared||board[nr][nc].color===ICE_COLOR)continue;
    const t=board[r][c].color;board[r][c].color=board[nr][nc].color;board[nr][nc].color=t;
    const ok=findAll().length>0;const t2=board[r][c].color;board[r][c].color=board[nr][nc].color;board[nr][nc].color=t2;
    if(ok)return[{r,c},{r:nr,c:nc}];}}
  return null;
}
function showHint(){
  const pair=findSwap();if(!pair){footerMsg.textContent='无可用交换, 洗牌中...';do shuffleBoard();while(!hasSwap());renderBoard();resetIdleTimer();return;}
  hintCells=pair;renderBoard();
  const t=document.createElement('div');t.className='idle-toast';t.textContent='';
  const w=document.querySelector('.board-wrap');if(w)w.appendChild(t);setTimeout(()=>{if(t.parentNode)t.remove();},3000);
}

function showNoSwapPrompt(){
  return new Promise(resolve=>{
    const ov=document.createElement('div');
    ov.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);border-radius:16px;z-index:50;gap:12px';
    ov.innerHTML='<div style="color:#FFF;font-size:14px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.5)">没有可交换的宝石</div>';
    const btn1=document.createElement('button');
    btn1.textContent='消耗5步 刷新棋盘';

async function trySwap(r1,c1,r2,c2){
  try{
  isAnimating=1;clearHints();selectedGem=null;
  if(idleTimer){clearTimeout(idleTimer);idleTimer=null;}
  const c1c=board[r1][c1].color,c2c=board[r2][c2].color;
  board[r1][c1].color=c2c;board[r2][c2].color=c1c;renderBoard();await delay(200);
  const m=findAll();
  if(m.length>0){
    steps--;updateUI();isPlayerTurn=0;await procMatch(m);
    if(enemy.hp<=0){updateUI();showVictory();isAnimating=0;return;}
    if(steps<=0){showDefeat();isAnimating=0;return;}
    await delay(500);enemyAttack();await delay(300);
    for(const c of team)if(c.skillCooldown>0)c.skillCooldown--;
    renderTeam();
    // 二次自动大招检查（兜底 procMatch 中可能遗漏的情况）
    for(const c of team)if(c.energy>=c.maxEnergy){try{await castUltimateWithAnim(c);}catch(e){footerMsg.textContent='⚠ 大招异常: '+e.message;}break;}
    isPlayerTurn=1;
    if(!hasSwap()){await showNoSwapPrompt();}
  }else{
    board[r1][c1].color=c1c;board[r2][c2].color=c2c;renderBoard();

    await delay(200);if(e1)e1.style.borderColor='';if(e2)e2.style.borderColor='';
  }
  isAnimating=0;resetIdleTimer();
  }catch(e){footerMsg.textContent='⚠ 错误: '+e.message;isAnimating=0;isPlayerTurn=1;console.error(e);}
}

async function procMatch(matches){
  const all=new Set();for(const m of matches)for(const[r,c]of m)all.add(r+','+c);
  const list=[...all].map(s=>s.split(',').map(Number));
  const mc=board[matches[0][0][0]][matches[0][0][1]].color,cnt=list.length;
  for(const[r,c]of list){const el=gem(r,c);if(el)el.classList.add('removing');}
  await delay(300);
  for(const[r,c]of list){board[r][c].cleared=1;board[r][c].color=0;}
  // 清除相邻冰块（去重）
  const iceSet=new Set();
  for(const[r,c]of list)for(const[dr,dc]of [[0,1],[1,0],[0,-1],[-1,0]]){
    const nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<B&&nc>=0&&nc<B&&!board[nr][nc].cleared&&board[nr][nc].color===ICE_COLOR)iceSet.add(nr+','+nc);
  }
  // 同行/列消除≥3个宝石时，清空该行/列全部冰块 + 爆破效果（仅火、岩触发）
  const rowCnt={},colCnt={};
  for(const[r,c]of list){rowCnt[r]=(rowCnt[r]||0)+1;colCnt[c]=(colCnt[c]||0)+1;}
  let hasRow=false,hasCol=false;
  if(mc===0||mc===3){
    // 按单个连通簇判断，不相连的同排不触发
    const affectedRows=new Set(),affectedCols=new Set();
    for(const m of matches){
      const rCnt={},cCnt={};
      for(const[r,c]of m){rCnt[r]=(rCnt[r]||0)+1;cCnt[c]=(cCnt[c]||0)+1;}
      for(let r=0;r<B;r++)if(rCnt[r]>=3){hasRow=true;affectedRows.add(r);for(let ic=0;ic<B;ic++)if(board[r][ic].color===ICE_COLOR&&!board[r][ic].cleared)iceSet.add(r+','+ic);}
      for(let c=0;c<B;c++)if(cCnt[c]>=3){hasCol=true;affectedCols.add(c);for(let ir=0;ir<B;ir++)if(board[ir][c].color===ICE_COLOR&&!board[ir][c].cleared)iceSet.add(ir+','+c);}
    }
    if(hasRow||hasCol){
      footerMsg.textContent+=' '+(hasRow?'行爆破':'')+(hasRow&&hasCol?'+':'')+(hasCol?'列爆破':'');
      showSweep(mc,affectedRows,affectedCols);
    }
  }
  for(const k of iceSet){const[r,c]=k.split(',').map(Number);const el=gem(r,c);if(el)el.classList.add('removing');board[r][c].cleared=1;board[r][c].color=0;}
  comboCount++;
  const dmg=((team.find(x=>x.color===mc)?.atk||100)*0.18*cnt)|0;
  enemy.hp=Math.max(0,enemy.hp-Math.min(dmg,enemy.hp));
  if(enemy.hp<=0){updateUI();showVictory();return;}
  const eg=cnt*10;for(const c of team)if(c.color===mc)c.energy=Math.min(c.maxEnergy,c.energy+eg);
  footerMsg.textContent='消除 '+cnt+' 个 '+CHARS[mc].name+' 元素, 能量+'+eg+'/100';
  score+=Math.floor(cnt*10*(1+(comboCount-1)*0.2));
  if(comboCount>1){comboEl.textContent=comboCount+'x 连击';comboEl.classList.remove('active');void comboEl.offsetWidth;comboEl.classList.add('active');}
  const ep=document.getElementById('enemyArea');if(ep){ep.classList.remove('hit');void ep.offsetWidth;ep.classList.add('hit');}playHit(1);
  gravity();renderBoard();await delay(300);renderTeam();updateUI();
  // 自动检测满能量释放大招
  for(const c of team)if(c.energy>=c.maxEnergy){try{await castUltimateWithAnim(c);}catch(e){footerMsg.textContent='⚠ 大招异常: '+e.message;}break;}
  const ch=findAll();if(ch.length>0){footerMsg.textContent='连锁消除';await procMatch(ch);}else{comboCount=0;comboEl.textContent='';}
}

const ULTRA_VOICE = {
  klee:'全都可以炸完',
  barbara:'演唱开始啦',
  xianyun:'该起飞了',
  zhongli:'天动万象'
};
const VOICE_FILE = {
  klee:'klee_burst.mp3',
  barbara:'barbara_burst.mp3',
  xianyun:'xianyun_burst.mp3',
  zhongli:'zhongli_burst.mp3'
};
const VOICE_VOLUME = {xianyun:1.2};
const voiceBuffer = {}; // AudioContext 解码后的语音缓冲
let speechUnlocked=false;
let voicePlaying=false;
let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playHit(low){
  if(voicePlaying)return;
  try{
    const id=low?'sfx_hitBoss':'sfx_hitPlayer';
    const a=document.getElementById(id);
    if(a){a.currentTime=0;a.play().catch(()=>{});}

document.addEventListener('pointerdown',()=>{
  speechUnlocked=true;
  // 1. 唤醒 AudioContext
  try{getAudioCtx().resume();}catch(e){}
  // 2. 静默顺序播放角色语音（iOS 解锁），从左到右不打断
  const voiceIds=['sfx_klee','sfx_barbara','sfx_xianyun','sfx_zhongli'];
  let vi=0;
  (function playNext(){
    if(vi>=voiceIds.length)return;
    const el=document.getElementById(voiceIds[vi++]);
    if(!el){playNext();return;}
    el.load();el.volume=0;
    const p=el.play();
    if(p!==undefined)p.then(()=>{el.pause();el.currentTime=0;playNext();}).catch(playNext);
    else playNext();
  })();
  // 3. 同时快速解锁打击音效
  ['sfx_hitBoss','sfx_hitPlayer','sfx_victory'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.load();
    const p=el.play();
    if(p!==undefined)p.then(()=>{el.pause();el.currentTime=0;}).catch(()=>{});
  });
  // 4. iOS Safari SpeechSynthesis 解锁
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(' ');u.volume=0;
    speechSynthesis.speak(u);
    setTimeout(()=>{speechSynthesis.pause();speechSynthesis.resume();},50);
  }catch(e){}
  // 5. 预加载所有语音到 AudioContext 缓冲（iOS 短音频兼容）
  for(const[id,fn] of Object.entries(VOICE_FILE)){
    const src='voice/'+fn;
    fetch(src).then(r=>r.arrayBuffer()).then(b=>{try{const ctx=getAudioCtx();ctx.decodeAudioData(b,(buf)=>{voiceBuffer[id]=buf;});}catch(e){}}).catch(()=>{});
  }
  // 5. 解锁并启动BGM（不暂停，保持播放）
  try{
    const bgm=document.getElementById('bgm_battle');
    if(bgm){bgm.load();bgm.volume=0.16;bgm.currentTime=0;bgm.play().catch(()=>{});}
  }catch(e){}
},{once:1});
function startBGM(){
  const a=document.getElementById('bgm_battle');
  if(!a)return;
  a.volume=0.16;
  try{a.currentTime=0;}catch(e){}
  a.play().catch(()=>{});
}
function stopBGM(){
  const a=document.getElementById('bgm_battle');
  if(!a)return;
  a.pause();
  try{a.currentTime=0;}catch(e){}
}
function playVoice(id){
  if(!speechUnlocked)return;
  voicePlaying=true;
  const vol=VOICE_VOLUME[id]||1.0;
  // 方式一：AudioContext 缓冲播放（对 iOS 短音频最可靠）
  if(voiceBuffer[id]){
    try{
      const ctx=getAudioCtx();
      if(ctx.state==='suspended')ctx.resume();
      const src=ctx.createBufferSource();
      src.buffer=voiceBuffer[id];
      const gain=ctx.createGain();
      gain.gain.value=vol;
      src.connect(gain);gain.connect(ctx.destination);
      src.start(0);
      src.onended=()=>setTimeout(()=>{voicePlaying=false;},200);
      setTimeout(()=>{voicePlaying=false;},5000);
      return;
    }catch(e){/* 回退到 audio 元素 */}
  }
  // 方式二：audio 元素播放（兜底）
  const a=document.getElementById('sfx_'+id);
  if(!a){setTimeout(()=>{voicePlaying=false;},100);return;}
  try{const ctx=getAudioCtx();if(ctx.state==='suspended')ctx.resume();}catch(e){}
  const doPlay=()=>{
    try{a.currentTime=0;}catch(e){}
    a.volume=vol;
    const p=a.play();
    if(p!==undefined)p.then(()=>setTimeout(()=>{voicePlaying=false;},200)).catch(()=>{
      try{const ctx=getAudioCtx();ctx.resume().then(()=>{
        try{a.currentTime=0;}catch(e){}
        a.play().then(()=>setTimeout(()=>{voicePlaying=false;},200)).catch(()=>setTimeout(()=>{voicePlaying=false;},100));
      }).catch(()=>setTimeout(()=>{voicePlaying=false;},100));}catch(e){setTimeout(()=>{voicePlaying=false;},100);}
    });
  };
  if(a.readyState>=3)doPlay();
  else{
    a.load();
    const timer=setTimeout(()=>{a.removeEventListener('canplaythrough',handler);doPlay();},500);
    const handler=()=>{clearTimeout(timer);doPlay();};
    a.addEventListener('canplaythrough',handler,{once:true});
  }
  setTimeout(()=>{voicePlaying=false;},5000);
}

function gravity(){
  for(let c=0;c<B;c++){
    // 收集本列未消除格子（同时记住原始行号）
    const keep=[];
    for(let r=B-1;r>=0;r--)if(!board[r][c].cleared)keep.push({...board[r][c],_row:r});
    // 清空整列
    for(let r=0;r<B;r++)board[r][c]={color:0,cleared:1,falling:0};
    // 从底部放回保留的格子，只对实际移动的格子加下落动画
    const filled=keep.length;
    for(let i=0;i<filled;i++){
      const src=keep[i];
      const newRow=B-1-i;
      board[newRow][c]={color:src.color,cleared:0,falling:src._row!==newRow?1:0};
    }
    // 顶部填充新宝石（约10%概率生成冰块）
    for(let r=B-1-filled;r>=0;r--)board[r][c]={color:Math.random()<0.2?ICE_COLOR:TEAM_COLORS[Math.random()*4|0],cleared:0,falling:1};
  }
  // 二次修补
  for(let r=0;r<B;r++)for(let c=0;c<B;c++)if(board[r][c].cleared)board[r][c]={color:TEAM_COLORS[Math.random()*4|0],cleared:0,falling:0};
}

function findAll(){
  const visited=Array.from({length:B},()=>Array(B).fill(0));
  const r=[];
  for(let i=0;i<B;i++)for(let j=0;j<B;j++){
    if(visited[i][j]||board[i][j].cleared||board[i][j].color===ICE_COLOR)continue;
    const color=board[i][j].color;
    const cluster=[];
    const stack=[[i,j]];
    visited[i][j]=1;
    while(stack.length){
      const [cr,cc]=stack.pop();
      cluster.push([cr,cc]);
      for(const[dr,dc] of [[0,1],[1,0],[0,-1],[-1,0]]){
        const nr=cr+dr,nc=cc+dc;
        if(nr>=0&&nr<B&&nc>=0&&nc<B&&!visited[nr][nc]&&!board[nr][nc].cleared&&board[nr][nc].color===color){
          visited[nr][nc]=1;
          stack.push([nr,nc]);
        }
      }
    }
    if(cluster.length>=M)r.push(cluster);
  }
  return r;
}

function hasSwap(){
  for(let r=0;r<B;r++)for(let c=0;c<B;c++){if(board[r][c].cleared||board[r][c].color===ICE_COLOR)continue;
    const dirs=[[0,1],[1,0]];for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;
    if(nr>=B||nc>=B||board[nr][nc].cleared||board[nr][nc].color===ICE_COLOR)continue;
    const t=board[r][c].color;board[r][c].color=board[nr][nc].color;board[nr][nc].color=t;
    const ok=findAll().length>0;const t2=board[r][c].color;board[r][c].color=board[nr][nc].color;board[nr][nc].color=t2;
    if(ok)return 1;}}
  return 0;
}

function shuffleBoard(){
  const colors=[];for(let r=0;r<B;r++)for(let c=0;c<B;c++)if(!board[r][c].cleared&&board[r][c].color!==ICE_COLOR)colors.push(board[r][c].color);
  for(let i=colors.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[colors[i],colors[j]]=[colors[j],colors[i]];}
  let idx=0;for(let r=0;r<B;r++)for(let c=0;c<B;c++)if(!board[r][c].cleared&&board[r][c].color!==ICE_COLOR)board[r][c].color=colors[idx++];
}

function updateUI(){
  if(stepsEl)stepsEl.textContent=steps;
  hpBar.style.width=(enemy.hp/enemy.maxHP*100)+'%';
  hpText.textContent=enemy.hp+' / '+enemy.maxHP;
  scoreEl.textContent='得分: '+score;
  document.getElementById('playerHPBar').style.width=(playerHP/playerMaxHP*100)+'%';
  document.getElementById('playerHPText').textContent=playerHP+' / '+playerMaxHP;
  // Shield bar
  const sb=document.getElementById('shieldBar');
  if(playerShield>0){
    sb.style.width=(playerShield/playerMaxHP*100)+'%';
    sb.style.display='block';
  }else{
    sb.style.width='0%';
    sb.style.display='none';
  }
}

function showVictory(){if(gameOver)return;gameOver=1;stopBGM();
  // 保存积分榜
  const lb=loadLeaderboard();
  const entry={score:score,date:new Date().toLocaleDateString()};
  lb.push(entry);
  lb.sort((a,b)=>b.score-a.score);
  if(lb.length>50)lb.length=50;
  saveLeaderboard(lb);
  const myRank=lb.findIndex(e=>e===entry)+1;
  // 渲染
  document.getElementById('victoryOverlay').classList.add('show');
  document.getElementById('victoryMsg').textContent='通关! 得分: '+score;
  document.getElementById('yourRank').textContent='🏆 本次排名 #'+myRank;
  const list=document.getElementById('rankList');
  list.innerHTML='';
  const medals=['','🥇','🥈','🥉'];
  for(let i=0;i<Math.min(lb.length,10);i++){
    const e=lb[i];
    const li=document.createElement('li');
    if(e===entry)li.classList.add('current');
    const badge=i<3?'<span class="rank-medal">'+medals[i+1]+'</span>':'<span class="rank-num">#'+(i+1)+'</span>';
    li.innerHTML=badge+'<span class="rank-score">'+e.score+'</span>';
    list.appendChild(li);
  }
  // 延迟播放胜利音效（等语音收尾）
  setTimeout(()=>{const a=document.getElementById('sfx_victory');if(a){try{a.currentTime=0;}catch(e){}a.volume=0.7;a.play().catch(()=>{});}},400);
}
function showDefeat(){gameOver=1;stopBGM();document.getElementById('defeatOverlay').classList.add('show');}

// 积分榜
function loadLeaderboard(){try{return JSON.parse(localStorage.getItem('xlwy_lb'))||[]}catch(e){return[]}}
function saveLeaderboard(lb){try{localStorage.setItem('xlwy_lb',JSON.stringify(lb))}catch(e){}}

// 行/列清冰爆破效果 - 从中心线往两侧渐变到70%
function showSweep(mc,affectedRows,affectedCols){
  const boardEl=document.getElementById('board');
  if(!boardEl)return;
  const br=boardEl.getBoundingClientRect();
  const cellW=br.width/8,cellH=br.height/8;
  const col=BD[mc]||'#FFD700';
  const r=parseInt(col.slice(1,3),16),g=parseInt(col.slice(3,5),16),b=parseInt(col.slice(5,7),16);
  const full='rgba('+r+','+g+','+b+',1)';
  const fade='rgba('+r+','+g+','+b+',0)';
  footerMsg.textContent+=' ✦行爆破';
  for(const rr of affectedRows){
    const el=document.createElement('div');
    el.style.cssText='position:fixed;left:'+br.left+'px;top:'+(br.top+rr*cellH)+'px;width:'+br.width+'px;height:'+cellH+'px;background:linear-gradient(to bottom,'+fade+','+full+' 25%,'+full+' 75%,'+fade+');opacity:0;z-index:9999;pointer-events:none;animation:flashPop 1s ease-out forwards';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
  }
  for(const cc of affectedCols){
    const el=document.createElement('div');
    el.style.cssText='position:fixed;left:'+(br.left+cc*cellW)+'px;top:'+br.top+'px;width:'+cellW+'px;height:'+br.height+'px;background:linear-gradient(to right,'+fade+','+full+' 25%,'+full+' 75%,'+fade+');opacity:0;z-index:9999;pointer-events:none;animation:flashPop 1s ease-out forwards';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1200);
  }
}
function delay(ms){return new Promise(r=>setTimeout(r,ms));}
function resetBattle(){
  document.getElementById('victoryOverlay').classList.remove('show');document.getElementById('defeatOverlay').classList.remove('show');
  enemy.hp=enemy.maxHP;playerHP=playerMaxHP;playerShield=0;steps=15;score=0;comboCount=0;
  gameOver=0;isPlayerTurn=1;isAnimating=0;selectedGem=null;
  initBoard();initTeam();renderBoard();renderTeam();updateUI();resetIdleTimer();startBGM();
}
init();
